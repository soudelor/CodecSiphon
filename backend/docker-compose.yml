# Local PostgreSQL + Redis for Prisma, API, and BullMQ (docs/ARCHITECTURE.md).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: codec_siphon
      POSTGRES_PASSWORD: codec_siphon
      POSTGRES_DB: codec_siphon

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'