# Local MySQL + Redis for Prisma migrate, API, and BullMQ (docs/ARCHITECTURE.md).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: codec_siphon_root
      MYSQL_DATABASE: codec_siphon
      MYSQL_USER: codec_siphon
      MYSQL_PASSWORD: codec_siphon
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
